<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Главная страница</title>
  <link href="styles/font.css" type="text/css" rel="stylesheet">
  <link href="styles/home.css" type="text/css" rel="stylesheet">
</head>

<body>
  <div class="content">
    <div class="menu">
      <div class="menu-icon-wrapper menu-icon-wrapper-active">
        <div class="menu-icon menu-icon-home"></div>
      </div>
      <div class="menu-icon-wrapper">
        <div class="menu-icon menu-icon-user"></div>
      </div>
      <div class="menu-icon-wrapper">
        <div class="menu-icon menu-icon-plus"></div>
      </div>
    </div>
    <div class="user-info">
      <img class="user-avatar" src="images/user_photo.png" alt="Аватар Вани Денисова">
      <span class="user-name">Ваня Денисов</span>
      <img class="edit-icon" src="images/edit-icon.svg" width="24" height="24" alt="Иконка редактирования">
    </div>
    <div class="container">
      <img class="images" src="images/evening.png" height="474" width="474" alt="Вечер">
      <div class="counter">
        <span>1/3</span>
      </div>
      <button class="next-button" aria-label="следующее фото"> </button>
    </div>
    <div class="likes">
      <img src="images/heart.png" alt="Реакции" title="Реакции" width="16" height="18">
      <span>203</span>
    </div>
    <input type="checkbox" class="read-more-checker" id="read-more-checker">
    <div class="limiter">
      <p>
        Так красиво сегодня на улице! Настоящая зима!) Вспоминается
        Бродский: «Поздно ночью, в уснувшей долине, на самом дне, в городке,
        занесенном снегом по ручку двери...»
      </p>
    </div>
    <label for="read-more-checker" class="read-more-button"></label>
    <div class="time">
      <p>
        2 часа назад
      </p>
    </div>
    <div class="user-info">
      <img class="user-avatar" src="images/liza_demina_avatar.png" alt="Аватар Лизы Дёминой">
      <span class="user-name">Лиза Дёмина</span>
    </div>
    <img src="images/still_life.png" width="474" height="239" alt="Стиль жизни">
  </div>
</body>

</html>
